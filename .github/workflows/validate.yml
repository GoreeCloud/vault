name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24'
      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Type check and build
        run: npm run build
      - name: Synthetic security and format tests
        run: npm test
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
  native:
    name: native
    # Stable Ubuntu image avoids long apt migrations on the latest preview image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: Linux desktop prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            # The Ubuntu security HTTP mirror returned 520 on main
            # (run 44533756775). Use the official HTTPS archives and retain
            # every Signed-By/trust setting without bypassing apt validation.
            bash scripts/test_ubuntu_apt_sources.sh
            sudo bash scripts/prepare_ubuntu_apt_sources.sh
            timeout 300s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 update
            timeout 900s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -y --no-install-recommends install "${missing[@]}"
          fi
          command -v cmake
          command -v clang
          command -v ninja
          pkg-config --exists gtk+-3.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Resolve pinned Dart dependencies
        working-directory: apps/native
        run: flutter pub get
      - name: Analyze native application
        working-directory: apps/native
        run: flutter analyze
      - name: Test native and cross-platform format
        working-directory: apps/native
        run: flutter test
      - name: Compile native Linux desktop
        working-directory: apps/native
        run: flutter build linux --release

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 pinned
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Resolve Dart dependencies
        working-directory: apps/native
        run: flutter pub get
      - name: Compile Android debug APK
        working-directory: apps/native
        run: flutter build apk --debug
      - name: Confirm generated development APK
        run: test -s apps/native/build/app/outputs/flutter-apk/app-debug.apk
  firefox:
    name: firefox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24'
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build production extension assets
        run: npm run build
      - name: Run extension origin protection tests
        run: npm test
      - name: Mozilla WebExtensions lint
        run: npm run lint:extension
      - name: Audit all extension dependencies
        run: npm audit --audit-level=high
      - name: Produce unsigned development extension archive
        run: npm run package
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24'
      - name: Install locked application and test dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install trusted Playwright browser engines
        run: npx playwright install --with-deps chromium firefox
      - name: Exercise synthetic encrypted backup and OTP flows in real browsers
        run: npm run test:e2e
      - name: Install Firefox extension popup test dependencies
        working-directory: apps/firefox
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Exercise extension popup with a mock browser API in Firefox
        working-directory: apps/firefox
        run: npm run test:e2e

  webauthn-test-rp:
    name: webauthn-test-rp
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/webauthn-rp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24'
      - name: Install exact WebAuthn test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Test bounded one-time challenge lifecycle
        run: npm test
      - name: Install Chromium for isolated virtual authenticator
        run: npx playwright install --with-deps chromium
      - name: Run disposable WebAuthn protocol integration tests
        run: npm run test:e2e
      - name: Audit test RP dependencies
        run: npm audit --audit-level=high
