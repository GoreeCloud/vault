name: Vault lock lifecycle reference tests
on:
  pull_request:
    paths:
      - 'tools/lock_lifecycle_reference.py'
      - 'tests/test_lock_lifecycle_reference.py'
      - 'tests/test_lock_lifecycle_subclass_guard.py'
      - '.github/workflows/lock-lifecycle-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated metadata lifecycle tests
        run: python -m unittest discover -s tests -p 'test_lock_lifecycle*.py' -v
