name: Vault foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact-source and GoreeCloud policy tests
        run: npm test
      - name: Check sensitive files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|vault\.db|bitwarden_license)(/|$)'; then
            echo 'Prohibited secret/commercial path found' >&2
            exit 1
          fi
