name: Vault native development server

on:
  push:
    paths:
      - "services/vault-dev-server/**"
      - ".github/workflows/vault-dev-server.yml"
  pull_request:
    paths:
      - "services/vault-dev-server/**"
      - ".github/workflows/vault-dev-server.yml"

permissions:
  contents: read

jobs:
  native-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/vault-dev-server/go.mod
          cache: false
      - name: Test native server capabilities and credential-denial
        working-directory: services/vault-dev-server
        run: go test -race ./...
      - name: Vet native server code
        working-directory: services/vault-dev-server
        run: go vet ./...
      - name: Compile native Linux amd64 process
        working-directory: services/vault-dev-server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/goreecloud-vault-dev-server .
