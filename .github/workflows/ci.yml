name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'foundation/**'
      - 'security/**'
  pull_request:

permissions:
  contents: read

env:
  GOREECLOUD_VAULT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOREECLOUD_VAULT_SOURCE_REVISION }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOREECLOUD_VAULT_SOURCE_REVISION"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify module integrity
        run: go mod verify

      - name: Enforce tidy module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/goreecloud-vault
