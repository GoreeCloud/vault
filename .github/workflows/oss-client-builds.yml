name: OSS client compilation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    name: Compile OSS client entry points
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_DAEMON: "false"
      NX_ISOLATE_PLUGINS: "false"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install approved Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependency lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CLI OSS dev compilation
        run: npx nx build cli --configuration=oss-dev --verbose
      - name: Validate development CLI endpoint rejection with synthetic profile
        run: bash scripts/check_cli_config_server_gate.sh
      - name: Validate restricted CLI receive/serve paths in development
        run: bash scripts/check_cli_disabled_receive_serve.sh
      - name: Validate CLI server URL syntax and upstream service rejection
        run: npx jest --config apps/cli/jest.config.js --runInBand --runTestsByPath apps/cli/src/platform/commands/server-config-validation.spec.ts
      - name: Verify fork-only CLI process flags and failure exit behavior
        run: npx jest --config apps/cli/jest.config.js --runInBand --runTestsByPath apps/cli/src/base-program.spec.ts
      - name: Verify CLI outbound API origins and redirect rejection using loopback
        run: npx jest --config apps/cli/jest.config.js --runInBand --runTestsByPath apps/cli/src/platform/services/cli-api-destination-policy.spec.ts apps/cli/src/platform/services/node-api.service.spec.ts
      - name: Verify CLI session environment isolation with synthetic keys
        run: npx jest --config apps/cli/jest.config.js --runInBand --runTestsByPath apps/cli/src/platform/services/node-env-secure-storage.service.spec.ts apps/cli/src/auth/commands/login.command.spec.ts apps/cli/src/key-management/commands/unlock.command.spec.ts
      - name: Verify fork-only CLI profile with disposable HOME
        run: bash scripts/check_cli_profile_isolation.sh
      - name: Verify CLI update command fails closed
        run: bash scripts/check_cli_update_disabled.sh
      - name: Web Vault OSS dev compilation
        run: npx nx build web --configuration=oss-dev --verbose
      - name: Browser extension Chrome dev compilation
        run: npx nx build browser --configuration=chrome-dev --verbose
      - name: Firefox Manifest V3 extension dev compilation
        run: npx nx build browser --configuration=firefox-dev --verbose
      - name: Desktop main process OSS dev compilation
        run: npx nx run desktop:build-main --configuration=oss-dev --verbose
