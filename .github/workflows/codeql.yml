name: CodeQL Source Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  detect-languages:
    name: detect-codeql-source-languages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Include Python only when Python source is tracked
        id: detect
        shell: bash
        run: |
          if git ls-files -- '*.py' | grep -q .; then
            echo 'languages=["javascript-typescript","actions","python"]' >> "$GITHUB_OUTPUT"
          else
            echo 'languages=["javascript-typescript","actions"]' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect-languages
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.languages) }}
    steps:
      - name: Checkout repository without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Initialize trusted source-only CodeQL analysis
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4 pinned commit
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze without executing untrusted project builds
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4 pinned commit
