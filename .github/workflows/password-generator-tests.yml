name: Vault password generator checks

on:
  pull_request:
    paths:
      - "tools/password_generator.py"
      - "tests/test_password_generator.py"
      - ".github/workflows/password-generator-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/password_generator.py"
      - "tests/test_password_generator.py"
      - ".github/workflows/password-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile module
        run: python -m py_compile tools/password_generator.py tests/test_password_generator.py
      - name: Run generator regression tests
        run: python -m unittest discover -s tests -p 'test_password_generator.py' -v
