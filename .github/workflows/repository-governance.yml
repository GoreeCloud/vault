name: Repository Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOREECLOUD_VAULT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate repository governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOREECLOUD_VAULT_SOURCE_REVISION }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOREECLOUD_VAULT_SOURCE_REVISION"

      - name: Validate mandatory Vault records and security gates
        run: python3 scripts/validate_repository_governance.py
