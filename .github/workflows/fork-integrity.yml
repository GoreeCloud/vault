name: Source import integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify license boundary and source attribution
        run: python3 scripts/check_fork_integrity.py
      - name: Regression tests for import guard
        run: python3 -m unittest discover -s tests -p 'test_fork_integrity.py'
      - name: Product shell identity smoke tests
        run: python3 -m unittest discover -s tests -p 'test_product_identity.py'
      - name: Canonical Vault icon provenance and PNG dimensions
        run: python3 -m unittest discover -s tests -p 'test_vault_icon_provenance.py'
      - name: Dependency patch and lockfile integrity guards
        run: python3 -m unittest discover -s tests -p 'test_dependency_security_versions.py'
      - name: Inherited cryptography call-site change detection
        run: python3 -m unittest discover -s tests -p 'test_legacy_dependency_review.py'
      - name: CLI profile source boundary guards
        run: python3 -m unittest discover -s tests -p 'test_cli_isolation_boundary.py'
      - name: CLI upstream update rejection guard
        run: python3 -m unittest discover -s tests -p 'test_cli_update_boundary.py'
      - name: CLI secret session namespace guard
        run: python3 -m unittest discover -s tests -p 'test_cli_session_boundary.py'
      - name: CLI API credential environment boundary guard
        run: python3 -m unittest discover -s tests -p 'test_cli_api_key_namespace.py'
      - name: CLI outbound request User-Agent identity
        run: python3 -m unittest discover -s tests -p 'test_cli_user_agent_identity.py'
      - name: CLI development network entrypoint guard
        run: python3 -m unittest discover -s tests -p 'test_cli_send_hold.py'
      - name: CLI inherited process environment isolation
        run: python3 -m unittest discover -s tests -p 'test_cli_ambient_flags.py'
